name: Check Yazoni Bot
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check src/index.js
      - run: node --check src/game.js
      - run: node --check src/ai.js
      - run: node --check src/memory.js
